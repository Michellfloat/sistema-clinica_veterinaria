# ===== Comum a todos os perfis =====
spring.application.name=clinica-veterinaria
# Carrega variÃ¡veis do arquivo .env (DotEnv) quando existir
spring.config.import=optional:file:.env[.properties]
# Perfil padrÃ£o: local | dev | homolog | prod  (use SPRING_PROFILES_ACTIVE para trocar)
spring.profiles.default=local
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saep_db?createDatabaseIfNotExist=true&serverTimezone=America/Bahia&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bahia
# Flyway: se o banco jÃ¡ foi criado pelo saep_db.sql, assume a V1 como baseline
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# SeguranÃ§a (TROQUE em produÃ§Ã£o!)
app.jwt.secret=${JWT_SECRET:clinica-veterinaria-chave-jwt-super-secreta-trocar-em-producao-2026}
# ExpiraÃ§Ã£o do token: 60000 ms = 1 minuto (exigÃªncia do projeto)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:60000}
app.crypto.secret=${CRYPTO_SECRET:clinica-veterinaria-chave-aes-cpf-dev}
app.crypto.hash-secret=${CRYPTO_HASH_SECRET:clinica-veterinaria-chave-hmac-cpf-dev}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.seed.enabled=${SEED_ENABLED:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html